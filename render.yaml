services:
  - type: web
    name: blackbox-api
    runtime: docker
    plan: free
    envVars:
      # Secrets: Render prompts for these on first deploy (copy from your .env)
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_UNPOOLED
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: DEMO_AUTH_PASSWORD
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: APP_BASE_URL
        sync: false
      - key: DEMO_AUTH_SECRET
        generateValue: true
      - key: LLM_PROVIDER
        value: gemini
      - key: LLM_MODEL
        value: gemini-flash-latest
      - key: DEMO_AUTH_ENABLED
        value: "1"
      - key: DEMO_AUTH_EMAIL
        value: blackbox@gmail.com
